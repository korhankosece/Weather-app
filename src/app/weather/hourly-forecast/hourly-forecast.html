<div class="hourly-forecast">
  <div class="container">
    <div class="scroll">
      @for (hour of hourlyData(); track hour.time) {
        <div class="card">
          <div class="time">{{ hour.time }}</div>
          <img 
            [src]="'/images/icons/' + hour.icon + '_t@2x.png'" 
            [alt]="hour.time"
            class="icon"
          />
          <div class="temp">{{ hour.temperature }}°C</div>
        </div>
      }
    </div>
  </div>
</div>
