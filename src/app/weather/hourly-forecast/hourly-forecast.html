@if (weatherService.loading()) {
  <app-skeleton height="250px" />
} @else if (hourlyData().length > 0) {
  <div class="hourly-forecast">
    <div class="header">
      <h3 class="title">Hourly Forecast</h3>
    </div>
    <div class="container">
      <div class="scroll">
        @for (hour of displayHourlyData(); track hour.dt) {
          <div class="card">
            <div class="time">{{ hour.time }}</div>
            <img 
              [src]="'/images/icons/' + hour.icon + '_t@2x.png'" 
              [alt]="hour.time"
              class="icon"
            />
            <div class="temp">{{ hour.displayTemperature }}{{ temperatureSymbol() }}</div>
          </div>
        }
      </div>
    </div>
  </div>
}
