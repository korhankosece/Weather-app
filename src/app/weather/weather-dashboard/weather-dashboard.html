<div class="dashboard-container">
  <app-search-bar (onSearch)="onSearch($event)" />

  @if (weatherService.loading()) {
    <div class="loading">Loading weather data...</div>
  }

  @if (weatherService.error()) {
    <div class="error">{{ weatherService.error() }}</div>
  }

  <app-current-weather />

  <app-hourly-forecast />

  <app-five-day-forecast />
</div>
