<div class="dashboard-container">
  <app-search-bar (onSearch)="onSearch($event)" />

  @if (weatherService.error()) {
    <app-error-banner 
      [message]="weatherService.error()!" 
      (onDismiss)="dismissError()"
    />
  }

  <app-current-weather />

  <app-hourly-forecast />

  <app-five-day-forecast />
</div>
