<div class="app-toggle">
  <span class="label">{{ leftLabel }}</span>
  <button
    type="button"
    class="switch"
    [class.switch--active]="checked()"
    (click)="toggle()"
    [attr.aria-label]="checked() ? 'Toggle off' : 'Toggle on'"
  >
    <span class="thumb"></span>
  </button>
  <span class="label">{{ rightLabel }}</span>
</div>
